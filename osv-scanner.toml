# Avisos de seguridad ACEPTADOS por el job dependency-scan de CI.
#
# Revisados el 15-09-2026 y el 10-10-2026 con los avisos de OSV y GitHub:
# ninguno está en código que atienda peticiones en producción y ninguno tiene
# arreglo sin saltar de versión mayor. Cada excepción caduca sola: al pasar
# ignoreUntil el aviso vuelve a poner CI en rojo y obliga a revisarlo. Un aviso
# NUEVO lo pone en rojo desde el primer día. Actualizar vitest a la 3 elimina
# los dos primeros.

